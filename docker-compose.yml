version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: servobill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servobill
      POSTGRES_USER: servobill
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servobill"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/kellertobias/servobill:latest
    container_name: servobill-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Node
      NODE_ENV: production
      
      # Database
      DATABASE_URL: postgresql://servobill:${DB_PASSWORD}@postgres:5432/servobill
      DATABASE_TYPE: postgres
      
      # Auth
      NEXTAUTH_URL: https://tax.danielschloss.de
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # Access Control
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      
      # Storage (lokal - einfachste Option)
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage
      
      # API URL
      NEXT_PUBLIC_API_URL: https://tax.danielschloss.de/api
      
      # Email (SMTP)
      MAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@danielschloss.de}
      
    volumes:
      - app_storage:/app/storage
    ports:
      - "9321:9321"

  worker:
    image: ghcr.io/kellertobias/servobill:latest
    container_name: servobill-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://servobill:${DB_PASSWORD}@postgres:5432/servobill
      DATABASE_TYPE: postgres
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - app_storage:/app/storage

volumes:
  postgres_data:
  app_storage:
